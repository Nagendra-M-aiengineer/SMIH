<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | SMIH - Environmental Learning Hub</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-body">

    <div class="auth-container">
        <div class="auth-brand">
            <a href="index.html" class="logo" style="text-decoration: none;" title="Return to Home">
                <div class="logo-icon">🌱</div>
                <span>SMIH</span>
            </a>
            <p>Smart Environmental Learning Hub</p>
        </div>

        <div class="auth-card">
            <h2>Join SMIH Today 🚀</h2>
            <p class="muted">Begin your journey toward becoming a certified Eco Champion.</p>

            <form id="registerForm">
                <label for="registerName">Full Name</label>
                <input type="text" id="registerName" placeholder="e.g. Nagendra M" required>

                <label for="registerEmail">Campus Email</label>
                <input type="email" id="registerEmail" placeholder="e.g. name@campus.edu" required>

                <label for="registerPassword">Password</label>
                <input type="password" id="registerPassword" placeholder="Create a secure password" required>

                <label for="registerRole">Portal Role</label>
                <select id="registerRole" required>
                    <option value="student">Student (Eco Champion)</option>
                    <option value="teacher">Teacher / Faculty</option>
                    <option value="institution">Institution / Campus Admin</option>
                </select>

                <button class="primary-btn full-btn" type="submit">
                    Create Account & Get Started →
                </button>
            </form>

            <div id="registerMessage"></div>

            <p class="auth-footer">
                Already have an account?
                <a href="login.html">Sign In</a>
                <span style="margin: 0 8px; color: var(--border);">•</span>
                <a href="index.html">← Back to Home</a>
            </p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
